name: SpeakSpot integration checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/integration]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn python-multipart httpx pytest numpy pymupdf kiwipiepy
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run search and integration tests (mock models)
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Lint
        run: pnpm lint
